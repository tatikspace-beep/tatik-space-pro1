name: Force Vercel Rebuild

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "api/**"
      - "shared/**"
      - "drizzle/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vercel.json"
      - ".github/workflows/vercel-deploy.yml"
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Vercel deployment token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add the VERCEL_TOKEN GitHub Actions secret before deploying."
            exit 1
          fi

      - name: Deploy production to Vercel
        run: |
          npm i -g vercel
          vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN"
          vercel --prod --scope "$VERCEL_TEAM_SCOPE" --token="$VERCEL_TOKEN" --force
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_SCOPE: tatikspace-beeps-projects
          VERCEL_PROJECT_ID: prj_ln6ex769J6uEvyqRUnhT0zv1WXqB
